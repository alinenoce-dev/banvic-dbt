
sources:
  - name: erp
    description: Esse é o sistema ERP da Banvic com dados de clientes, claboradores, contas e transações
    schema: erp_banvic
    tables:
      - name: localidades
        description: Tabela fonte de localidades com informação de cidade e estado
        columns:
          - name: cod_localidade 
            description: chave primária da tabela localidades
            data_tests:
              - unique
              - not_null
              

      - name: clientes
        description: Tabela fonte de clientes com informação pessoais de cada cliente da Banvic.
        columns:
          - name: cod_cliente
            description: chave primária da tabela clientes.
            data_tests:
              - unique
              - not_null
              

      - name: colaboradores
        description: Tabela fonte de colaboradores com informação pessoais de cada colaborador da Banvic.
        columns:
          - name: cod_colaborador
            description: chave primária da tabela colaboradores.
            data_tests:
              - unique
              - not_null
              

      - name: agencias
        description: Tabela fonte de agencias com informação pessoais de cada agencia da Banvic.
        columns:
          - name: cod_agencia
            description: chave primária da tabela agencias
            data_tests:
              - unique
              - not_null
              