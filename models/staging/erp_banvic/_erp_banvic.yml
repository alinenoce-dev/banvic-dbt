
sources:
  - name: erp
    description: Esse é o sistema ERP da Banvic com dados de clientes, claboradores, contas e transações
    schema: erp_banvic
    tables:
      - name: localidades
        description: Tabela fonte de localidades com informação de cidade e estado
        columns:
          - name: cod_localidade 
            description: chave primária da tabela localidades
            data_tests:
              - unique
              - not_null
              

      - name: clientes
        description: Tabela fonte de clientes com informação pessoais de cada cliente da Banvic.
        columns:
          - name: cod_cliente
            description: chave primária da tabela clientes.
            data_tests:
              - unique
              - not_null
              

      - name: colaboradores
        description: Tabela fonte de colaboradores com informação pessoais de cada colaborador da Banvic.
        columns:
          - name: cod_colaborador
            description: chave primária da tabela colaboradores.
            data_tests:
              - unique
              - not_null
              

      - name: agencias
        description: Tabela fonte de agencias com informação pessoais de cada agencia da Banvic.
        columns:
          - name: cod_agencia
            description: chave primária da tabela agencias
            data_tests:
              - unique
              - not_null
              
      - name: colaborador_agencia
        data_tests:
          - dbt_utils.unique_combination_of_columns:
             arguments:
              combination_of_columns:
                - cod_colaborador
                - cod_agencia

            - name: contas
        description: Tabela feonte de contas de clientes da Banvic, inlcuindo chaves estrangeiras das agencias, colaboradores e localidades, além d data de abertura, tipo_conta e saldo.
        columns:
          - name: num_contas
            description: chave primária tabela contas
            data_tests:
              - unique
              - not_null

      - name: propostas_credito
        description: Tabela fonte de todas as propostas de crédito feita aos clientes da Banvic, incluindo taxa de juros, valor da propsta, do financiamento, de entreda, da prestacao quantidade de parcelas, carencia e status da proposta.
        columns:
          - name: cod_proposta
            description: chave primária da tabela de proposta de crédito.
            data_tests:
              - unique
              - not_null

      - name: trasacoes
        description: Tabela fonte de trasacoes realizadas pelos clientes da Banvic, incluindo tipo, valor e data da transacao.
        columns:
          - name: cod_transacao
            description: chave primária da tabela transacoes.
            data_tests:
              - unique
              - not_null